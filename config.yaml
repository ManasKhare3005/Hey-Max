# Max configuration. Edit freely; restart Max to apply.

assistant:
  name: Max
  user_name: Manas
  # How many tool-calling rounds the agent may take for one request
  max_steps: 8

llm:
  host: http://127.0.0.1:11434
  # Small model that lives on the GPU and handles most commands fast.
  # Must be the -instruct tag: plain qwen3:4b is now the Thinking-2507 build, which
  # always reasons (hundreds of hidden tokens per reply, even with think: false).
  fast_model: qwen3:4b-instruct
  # Bigger model loaded only when a request needs real planning/reasoning
  planner_model: qwen3:8b
  # How long Ollama keeps a model in VRAM after the last request
  keep_alive: 15m
  temperature: 0.3
  # Qwen3 "thinking" mode is slow on a 4GB GPU; keep it off for snappy replies
  think: false
  request_timeout_s: 180
  # Context window in tokens. Prompt + tools is ~1.3k; 4096 leaves room for history
  # while keeping the 4b model fully on a 4 GB GPU (also set OLLAMA_FLASH_ATTENTION=1
  # and OLLAMA_KV_CACHE_TYPE=q8_0 for Ollama; setup.ps1 does this)
  num_ctx: 4096
  # Max tokens per reply; spoken answers are short, this stops runaway output
  num_predict: 256
  # Force all of the fast model's layers onto the GPU. Ollama's own estimate leaves ~1 GB
  # unused here and splits the model with the CPU (measured 33 -> 52 tokens/s). If loading
  # fails (e.g. a game holding VRAM) it retries with Ollama's default. Remove to disable.
  fast_model_gpu_layers: 99

wake_word:
  # sherpa: listens for `phrase` below, any English words, no training.
  # openwakeword: pre-trained models only (e.g. hey_jarvis).
  # If the chosen engine fails to load, it falls back to openWakeWord "Hey Jarvis".
  engine: sherpa
  phrase: Hey Max
  # Seconds to ignore the wake word after it fires (prevents one call firing twice)
  cooldown_s: 1.0
  sherpa:
    model_dir: models/kws/gigaspeech-3.3M
    # 0..1, raise if it triggers by accident, lower if it misses you. Tuned 2026-09-29 for quiet
    # speech (0.12 + boost 2 + gain 16: best recall, still 0 false triggers on near-miss phrases)
    threshold: 0.12
    # How strongly decoding favours the phrase; raise a little if it misses you
    boost: 2.0
    # Parallel decoders offset in time so the phrase is caught wherever it falls
    # (1 stream misses ~1 in 5 calls). ~3% of one CPU core each.
    streams: 4
    # Boost quiet speech up to this factor (1 = off). Loud speech is never changed.
    max_gain: 16.0
  openwakeword:
    # Built-in name (hey_jarvis, alexa, hey_mycroft) or a custom .onnx path
    model: hey_jarvis
    threshold: 0.5

web:
  # Self-hosted SearXNG (docker compose up -d). Falls back to DuckDuckGo when it's not running.
  searxng_url: http://127.0.0.1:8888
  fallback_duckduckgo: true
  results: 5
  timeout_s: 8
  # Read this many top pages for each search (more accurate, ~1-3 s slower). 0 = snippets only
  read_pages: 4

browser:
  # Max's own Chrome window (separate profile; sign in to sites there once). Websites and
  # Google searches open here so Max can click, type and read them.
  enabled: true
  profile_dir: data/browser-profile
  # "chrome" = your installed Chrome; "chromium" = Playwright's own (run: playwright install chromium)
  channel: chrome
  headless: false

memory:
  # Facts you ask Max to remember, the conversation log, reminders and the action log
  enabled: true
  db: data/max.db

digest:
  # Morning email: what's due (Canvas), classes and reminders for the day.
  # Needs the email section in secrets.yaml (Gmail + app password).
  enabled: true
  time: "07:00"
  weekends: true
  # If the laptop was off at `time`, send when Max starts, but not after this
  catch_up_until: "18:00"

notes:
  # Meeting / lecture notes: "Hey Max, take notes" (lecture: mic) or "take meeting notes"
  # (meeting: laptop audio + mic). Only the transcript and notes are kept, never audio.
  enabled: true
  folder: ~/Documents/Max Notes
  file: data/notes.md        # quick notes ("take a note: ...")
  # In meetings, also record your own voice from the mic (turn off if you use laptop
  # speakers and hear an echo in transcripts)
  include_mic_in_meetings: true
  # Live captions while recording: words show up ~0.5 s after they're said (small streaming
  # model, CPU). Rough at first; Whisper's accurate text replaces them every ~30 s, and only
  # Whisper's text is saved.
  live_captions: true
  live_model: models/live/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06

dashboard:
  # Live dashboard + API (the phone/watch apps will use the same API in Phase 4)
  enabled: true
  host: 127.0.0.1        # this laptop only
  port: 8765
  # Speak replies to commands typed in the dashboard (off: typing usually means "be quiet")
  speak_typed_replies: false

mail:
  # Your Gmail (address + app password go in secrets.yaml under gmail:). Mail comes straight from
  # Google to this laptop and is read by the local model. Sending always asks you first.
  enabled: true
  digest_important: true        # important unread mail in the morning digest
  alert_senders: []             # phone alert for mail from these, e.g. ["@asu.edu", "Professor Smith"]

voice_id:
  # Risky requests (send, delete, power...) in a voice that isn't yours need an Approve tap on
  # your phone instead of a spoken "yes". Enrol once: run.bat --enroll-voice
  enabled: true
  model: models/voiceid/eres2net_en_voxceleb.onnx
  profile: data/voice_profile.npy      # your voiceprint (numbers, not audio)
  threshold: 0.42                      # measured: you 0.63+, other voices 0.21 or less; raise to be stricter

course:
  # "Ask your course material": put slides, PDFs, Word and text files here (one subfolder per
  # course works best). Indexed on this laptop; the files are never changed or moved.
  enabled: true
  folders:
    - ~/Documents/Max Course Material
  include_lecture_notes: true   # also search your saved meeting/lecture notes
  rescan_minutes: 10
  index: data/course.db

alerts:
  # Phone notifications before Canvas deadlines and classes (needs the phone app paired)
  enabled: true
  hours_before_due: [24, 3]
  minutes_before_class: 10

phone:
  # Android app (Phase 4). The phone connects through Tailscale ("tailscale serve"), so the
  # API itself stays on 127.0.0.1. Pair it by scanning the QR code in the dashboard.
  enabled: true
  public_url: ""            # blank = auto-detect https://<laptop>.<tailnet>.ts.net
  token_file: data/phone_token.txt
  approval_timeout_s: 90    # a risky phone command waits this long for your tap, then = no

audio:
  sample_rate: 16000
  # null = system default microphone. Run `python -m max_assistant --list-devices` to see options
  input_device: null
  output_device: null
  # Stop recording after this much silence once you start talking
  silence_s: 1.0
  # Start transcribing after this much silence; if the words look like a finished request,
  # answer right away instead of waiting the full silence_s
  early_s: 0.4
  # If you trail off mid-sentence ("search for..."), wait up to this long for the rest
  max_silence_s: 1.8
  # Give up if you say nothing for this long after the wake word
  no_speech_timeout_s: 5.0
  max_record_s: 15.0
  # When Max's reply is a question, listen for your answer without the wake word
  follow_up: true
  # ...for this long before going back to waiting for "Hey Max"
  follow_up_timeout_s: 5.0
  # Start speaking the first sentence while the rest of the answer is still being written
  stream_replies: true
  # Say "stop" (or "Max stop") to cut Max off, or "Hey Max" to cut it off and ask something new
  barge_in: true
  # Multiplier over measured background noise to count as speech
  vad_sensitivity: 3.0
  chime: true

stt:
  # tiny.en / base.en / small.en / medium.en. small.en is the sweet spot on CPU
  model: small.en
  device: cpu        # keep on CPU so the LLM gets all the VRAM
  compute_type: int8
  # Words to expect; helps Whisper with commands and app/site names (quiet speech: 24% -> 19% errors)
  prompt: "Voice commands to an assistant called Max: open YouTube, search for, close this tab, play the video, volume, Spotify, Chrome, Google."
  # Optional fast engine for clear speech: Moonshine (~0.2 s vs ~1.8 s for Whisper), downloaded by
  # setup.ps1. Off by default: it misheard Manas's voice far more than Whisper does. Uncomment to try.
  # fast_model_dir: models/stt/sherpa-onnx-moonshine-base-en-int8
  fast_min_snr_db: 12

tts:
  # natural: a Microsoft natural voice (needs NaturalVoiceSAPIAdapter). "Online" voices send the
  # text of Max's replies to Microsoft to be spoken (what you say and everything else stays local);
  # Piper takes over automatically when offline. piper: fully local. sapi: built-in Windows voice.
  engine: piper
  natural_voice: Microsoft Ava Online
  piper_voice: models/piper/en_US-hfc_male-medium.onnx   # was en_US-ryan-medium.onnx
  speed: 1.0

safety:
  # Tools marked risky always need a spoken/typed "yes" first
  confirm_risky: true
  confirm_timeout_s: 8.0

logging:
  file: logs/max.log
  level: INFO

# Spoken name -> what to launch. Anything not listed is found via the Start Menu.
apps:
  notepad: notepad.exe
  calculator: calc.exe
  file explorer: explorer.exe
  explorer: explorer.exe
  command prompt: cmd.exe
  terminal: wt.exe
  powershell: powershell.exe
  task manager: taskmgr.exe
  settings: "ms-settings:"
  paint: mspaint.exe
  chrome: chrome
  edge: msedge
  vs code: code
  vscode: code
  visual studio code: code
  spotify: "spotify:"
  whatsapp: "whatsapp:"
